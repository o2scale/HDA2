name: PR Automation

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - develop
      - master
      - main
      - 'epic/**'

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate PR Title
        run: |
          # Check if PR title starts with [Story X.X]
          if [[ ! "${{ github.event.pull_request.title }}" =~ ^\[Story\ [0-9]\.[0-9]\] ]]; then
            echo "❌ PR title must start with [Story X.X]"
            echo "Example: [Story 1.3] Vertex AI Text Extraction Integration"
            exit 1
          fi
      
      - name: Check Branch Name
        run: |
          BRANCH=${{ github.head_ref }}
          if [[ ! "$BRANCH" =~ ^story/[0-9]\.[0-9]-.*$ ]]; then
            echo "❌ Branch name must follow pattern: story/X.X-description"
            echo "Example: story/1.3-vertex-ai-text-extraction"
            exit 1
          fi
      
      - name: Label PR
        uses: actions/labeler@v4
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        python-version: [3.13]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install Frontend Dependencies
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm ci
          
      - name: Run Frontend Tests
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm test --passWithNoTests
          
      - name: Install Backend Dependencies
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Run Backend Tests
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          cd backend
          pytest || echo "No tests found yet"