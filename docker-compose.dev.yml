version: '3.9'

# Development Docker Compose using Supabase Cloud
# This configuration uses:
# - Supabase Cloud for database (separate dev project)
# - Local Redis for caching and Celery broker
# - Local S3 (MinIO) or DigitalOcean Spaces for storage

services:
  # Redis for caching and Celery broker (local only)
  redis:
    image: redis:7-alpine
    container_name: hda_redis_dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hda_dev_network

  # MinIO for local S3-compatible storage (optional - can use Supabase Storage)
  minio:
    image: minio/minio:latest
    container_name: hda_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_dev_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hda_dev_network

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: hda_backend_dev
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Supabase Development Project
      DATABASE_URL: ${SUPABASE_DEV_DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_DEV_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_DEV_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_DEV_SERVICE_KEY}

      # Redis (local)
      REDIS_URL: redis://redis:6379/0

      # AI Services
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_AI_PROJECT: ${VERTEX_AI_PROJECT}

      # JWT & Security (development)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:80"

      # Environment
      ENVIRONMENT: development
      DEBUG: true
      LOG_LEVEL: debug

      # Storage (MinIO or Supabase Storage)
      USE_SUPABASE_STORAGE: ${USE_SUPABASE_STORAGE:-false}
      # If using MinIO:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-hda-documents-dev}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: us-east-1

      # Development settings
      RELOAD: true
      CORS_ALLOW_ALL: true
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python -m alembic upgrade head &&
        uvicorn api.main:app --reload --host 0.0.0.0 --port 8000
      "
    networks:
      - hda_dev_network

  # Celery Worker for background tasks
  celery_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: hda_worker_dev
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Supabase Development Project
      DATABASE_URL: ${SUPABASE_DEV_DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_DEV_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_DEV_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_DEV_SERVICE_KEY}

      # Redis (local)
      REDIS_URL: redis://redis:6379/0

      # AI Services
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      VERTEX_AI_PROJECT: ${VERTEX_AI_PROJECT}

      # Storage
      USE_SUPABASE_STORAGE: ${USE_SUPABASE_STORAGE:-false}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-hda-documents-dev}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}

      ENVIRONMENT: development
      C_FORCE_ROOT: true
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./temp:/app/temp
    command: >
      sh -c "
        watchmedo auto-restart --directory=/app --pattern='*.py' --recursive --
        celery -A workers.celery_app worker --loglevel=info --concurrency=2
      "
    networks:
      - hda_dev_network

  # Celery Beat for scheduled tasks
  celery_beat:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: hda_beat_dev
    depends_on:
      - redis
    environment:
      DATABASE_URL: ${SUPABASE_DEV_DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    command: celery -A workers.celery_app beat --loglevel=info
    networks:
      - hda_dev_network

  # Flower for Celery monitoring
  flower:
    image: mher/flower:latest
    container_name: hda_flower_dev
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
      FLOWER_BASIC_AUTH: admin:admin
    ports:
      - "5555:5555"
    networks:
      - hda_dev_network

  # Frontend Development Server
  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hda_frontend_dev
    environment:
      VITE_SUPABASE_URL: ${SUPABASE_DEV_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_DEV_ANON_KEY}
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - hda_dev_network

  # nginx (optional for production-like testing)
  nginx_dev:
    image: nginx:alpine
    container_name: hda_nginx_dev
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - hda_dev_network

# Development volumes
volumes:
  redis_dev_data:
  minio_dev_data:

# Development network
networks:
  hda_dev_network:
    driver: bridge