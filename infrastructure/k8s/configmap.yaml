apiVersion: v1
kind: ConfigMap
metadata:
  name: hda-config
  namespace: hda-platform
  labels:
    app: hda-translation
data:
  # Application Configuration
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "info"

  # API Configuration
  API_VERSION: "v1"
  API_PREFIX: "/api"
  ALLOWED_ORIGINS: "https://hda-platform.com,https://app.hda-platform.com"

  # Supabase Configuration (non-sensitive)
  SUPABASE_URL: "https://your-project.supabase.co"

  # S3/Spaces Configuration (non-sensitive)
  S3_REGION: "nyc3"
  S3_ENDPOINT_URL: "https://nyc3.digitaloceanspaces.com"
  S3_BUCKET_NAME: "hda-documents"

  # Redis Configuration (non-sensitive)
  REDIS_DB: "0"
  REDIS_MAX_CONNECTIONS: "50"

  # Celery Configuration
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
  CELERY_TASK_ALWAYS_EAGER: "false"
  CELERY_TASK_EAGER_PROPAGATES: "false"
  CELERY_WORKER_CONCURRENCY: "4"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "100"

  # Processing Configuration
  MAX_FILE_SIZE_MB: "500"
  OCR_BATCH_SIZE: "10"
  TRANSLATION_BATCH_SIZE: "100"

  # AI Configuration
  VERTEX_AI_LOCATION: "us-central1"
  GEMINI_MODEL: "gemini-1.5-pro"
  MAX_INPUT_TOKENS: "1048576"
  MAX_OUTPUT_TOKENS: "65536"